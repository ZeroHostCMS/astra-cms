name: AdditionalSalary
module: hrm
kind: transaction
submittable: true
naming: { series: "ADS-.YYMM.-.###" }

# A one-off earning or deduction for the payroll period that contains payroll_date.
fields:
  - { name: employee,         type: Link,     options: Employee, required: true, in-list: true, projected: true }
  - { name: employee_name,    type: Data,     read-only: true, in-list: true, pii: true }
  - { name: salary_component, type: Link,     options: SalaryComponent, required: true, in-list: true }
  - { name: amount,           type: Currency, required: true, in-list: true }
  - { name: payroll_date,     type: Date,     required: true, in-list: true }
  - { name: month,            type: Data,     read-only: true, projected: true }   # yyyy-MM of payroll_date
  - { name: reason,           type: Data }

permissions:
  - { role: admin,      read: true, create: true, write: true, submit: true, cancel: true }
  - { role: hr,         read: true, create: true, write: true, submit: true, cancel: true }
  - { role: accountant, read: true }
