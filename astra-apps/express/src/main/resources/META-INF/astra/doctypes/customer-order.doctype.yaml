name: CustomerOrder
module: oms
kind: transaction
submittable: true                 # Draft (0) -> Submitted (1) -> Cancelled (2) -> Amend
transaction: global               # submit/cancel span BMS credit (Seata AT) and pickup capacity (Seata TCC)
naming: { series: "ORD-.YYYYMMDD.-.#######", gapless: false }   # 7 digits: up to 9,999,999 orders a day per tenant; numbers come from per-instance blocks, no counter lock

fields:
  - { name: customer,         type: Link,     options: Customer, required: true, in-list: true, projected: true }
  - { name: receiver_name,    type: Data,     required: true, in-list: true, pii: true }
  - { name: receiver_phone,   type: Data,     required: true, pii: true }
  - { name: receiver_address, type: Text,     required: true, pii: true }
  - { name: zone,             type: Select,   options: [Same city, Domestic, Remote], default: Domestic, in-list: true, projected: true }
  - { name: service,          type: Select,   options: [Standard, Express], default: Standard, in-list: true }
  - { name: weight_kg,        type: Float,    required: true, label: Weight (kg) }
  - { name: cod_amount,       type: Currency, default: 0, label: COD amount, projected: materialised }   # bigint column: range filters (cod_amount__gt=...) use an index
  - { name: length_cm,        type: Float,    label: Length (cm) }                 # dimensions: volumetric weight L×W×H/6000
  - { name: width_cm,         type: Float,    label: Width (cm) }
  - { name: height_cm,        type: Float,    label: Height (cm) }
  - { name: shipping_fee,     type: Currency, read-only: true, in-list: true }   # sum of price_breakdown, computed by ShippingFeeHook
  - { name: priced_by,        type: Data,     read-only: true, in-list: true }   # the layers that priced it: rules, PricingRule, customer plugin
  - { name: price_breakdown,  type: JSON,     read-only: true }                  # one entry per price line, with where it came from
  - { name: waybill,          type: Link,     options: Waybill, read-only: true, in-list: true }   # created on submit
  - { name: note,             type: Text }
  # Electronic invoice (slot einvoice.issue, the tenant's country plugin), issued by EInvoiceJob after submit
  - { name: einvoice_status,  type: Data,     read-only: true, in-list: true, projected: true }   # Pending, Pending (no provider), Issuing, Issued
  - { name: einvoice_no,      type: Data,     read-only: true, in-list: true }
  - { name: einvoice_lookup,  type: Data,     read-only: true }
  - { name: einvoice_by,      type: Data,     read-only: true }

permissions:
  - { role: admin,      read: true, create: true, write: true, submit: true, cancel: true }
  - { role: sales,      read: true, create: true, write: true, if-owner: true, submit: true }
  - { role: ops,        read: true }
  - { role: care,       read: true }
  - { role: accountant, read: true, cancel: true }
  - { role: release-bot, read: true }
