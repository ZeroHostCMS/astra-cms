# Tenant scripts for the Express demo, compiled to WebAssembly and run by Astra's Tier 2 sandbox.
# PricingRule (tet-promo, runaway): `fee(weight_g: i64, zone: i64, express: i64, cod: i64) -> i64` in VND, zone
# 0 = Same city, 1 = Domestic, 2 = Remote, 3 = Island; it replaces the base line of the price.
# Customer pricing, slot pricing.customer (khaigia-*): `alloc` + `adjust` through astra-pricing-pdk, see docs/overlay-wasm.md.
# Anomaly detection, slot ops.anomaly (anomaly-*): `check(kind, a, b, c, d) -> i64`, see docs/overlay-wasm.md.
# Build with scripts/build-wasm.sh.
[workspace]
members = ["tet-promo", "runaway", "astra-pricing-pdk", "khaigia-shopabc", "abi-probe", "anomaly-ops"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
