apiVersion: v1
kind: Service
metadata:
  name: astra-server
spec:
  selector:
    app: astra-server
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: astra-server
spec:
  replicas: 2                     # two pods from the start: tenancy and naming series must be cluster-safe
  selector:
    matchLabels:
      app: astra-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: astra-server
    spec:
      containers:
        - name: astra-server
          image: astra/server:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASTRA_DB_URL
              valueFrom: { secretKeyRef: { name: astra-db, key: url } }
            - name: ASTRA_DB_USER
              valueFrom: { secretKeyRef: { name: astra-db, key: username } }
            - name: ASTRA_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: astra-db, key: password } }
            - name: ASTRA_TENANCY_MODE
              value: multi
          readinessProbe:
            httpGet: { path: /q/health/ready, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /q/health/live, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: astra-server
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: astra-server
                port:
                  number: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: astra-server
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: astra-server
