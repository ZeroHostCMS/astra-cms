# Astra login theme. Inherits every page template and script from the stock "keycloak" theme,
# replaces the layout (template.ftl) and swaps PatternFly for a single stylesheet.
parent=keycloak
import=common/keycloak

locales=vi,en

styles=css/astra.css
stylesCommon=

meta=viewport==width=device-width,initial-scale=1,viewport-fit=cover

## Page shell
kcHtmlClass=astra-html
kcBodyClass=astra-body
kcLoginClass=astra-shell
kcHeaderClass=astra-masthead
kcHeaderWrapperClass=astra-masthead__inner
kcFormCardClass=astra-card
kcFormHeaderClass=astra-card__header
kcContentWrapperClass=astra-row
kcInfoAreaWrapperClass=astra-info__inner
kcSignUpClass=astra-info
kcMarginTopClass=astra-mt

## Locale
kcLocaleMainClass=astra-locale
kcLocaleWrapperClass=
kcLocaleDropDownClass=
kcLocaleListClass=astra-locale__list
kcLocaleListItemClass=astra-locale__item
kcLocaleItemClass=astra-locale__link

