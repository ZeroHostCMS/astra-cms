<title id="astra-architecture-en-title">Astra CMS: every write goes through one engine</title>
<desc id="astra-architecture-en-desc">Clients call one Quarkus server; requests pass the REST API and the tenant-scoping kernel into the DocType engine, which writes to PostgreSQL under row-level security. Apps plug in as hooks, Wasm runs in a sandbox, Seata and Redis coordinate distributed transactions, Keycloak handles identity and a Rust CDC worker keeps replicas.</desc>
