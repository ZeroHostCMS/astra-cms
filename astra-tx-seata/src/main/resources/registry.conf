# Seata client bootstrap: plain files on the classpath, no registry or config centre.
# The server address comes from astra.seata.server (application.yml), set at startup.
registry {
  type = "file"
  file {
    name = "file.conf"
  }
}
config {
  type = "file"
  file {
    name = "file.conf"
  }
}
